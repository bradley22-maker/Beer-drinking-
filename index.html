<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summerhill Market — Store Evaluation</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap');

    :root {
      --green-dark:    #1e4620;
      --green-mid:     #2d5a27;
      --green-light:   #4a7c59;
      --green-pale:    #d4e6d0;
      --cream:         #faf6ed;
      --cream-warm:    #f0e9d8;
      --cream-border:  #ddd5be;
      --gold:          #b8935a;
      --gold-light:    #d4ad78;
      --text-dark:     #1a1a1a;
      --text-mid:      #4a4a4a;
      --text-muted:    #7a7a7a;
      --white:         #ffffff;
      --score-1:       #c0392b;
      --score-2:       #e67e22;
      --score-3:       #f1c40f;
      --score-4:       #27ae60;
      --score-5:       #1e4620;
      --shadow-sm:     0 2px 8px rgba(30,70,32,0.10);
      --shadow-md:     0 4px 20px rgba(30,70,32,0.15);
      --shadow-lg:     0 8px 40px rgba(30,70,32,0.18);
      --radius:        10px;
      --radius-lg:     16px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lato', sans-serif;
      background: var(--cream);
      color: var(--text-dark);
      min-height: 100vh;
    }

    /* ─── TOP BAR ─────────────────────────────────────────────────── */
    .topbar {
      background: var(--green-dark);
      color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 56px;
      font-size: 13px;
      letter-spacing: 0.05em;
    }
    .topbar-tagline { color: var(--gold-light); font-style: italic; font-weight: 300; }
    .topbar-date { color: var(--green-pale); }

    /* ─── HEADER ──────────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, var(--green-dark) 0%, var(--green-mid) 60%, var(--green-light) 100%);
      padding: 36px 32px 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    }
    header::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -30px;
      width: 240px; height: 240px;
      border-radius: 50%;
      background: rgba(255,255,255,0.03);
    }
    .header-leaf {
      font-size: 28px;
      margin-bottom: 6px;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--cream);
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    header h1 span { color: var(--gold-light); }
    header p.subtitle {
      margin-top: 8px;
      color: var(--green-pale);
      font-size: 0.95rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .header-divider {
      width: 60px;
      height: 2px;
      background: var(--gold);
      margin: 14px auto 0;
      border-radius: 2px;
    }

    /* ─── PROGRESS BAR ────────────────────────────────────────────── */
    .progress-wrap {
      background: var(--green-dark);
      padding: 12px 32px 16px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      color: var(--green-pale);
      font-size: 12px;
      margin-bottom: 6px;
      letter-spacing: 0.06em;
    }
    .progress-track {
      background: rgba(255,255,255,0.12);
      border-radius: 4px;
      height: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
      border-radius: 4px;
      transition: width 0.4s ease;
      width: 0%;
    }

    /* ─── LAYOUT ──────────────────────────────────────────────────── */
    .app-layout {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 60px;
      gap: 28px;
    }

    /* ─── SIDEBAR ─────────────────────────────────────────────────── */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
    }
    .sidebar-sticky {
      position: sticky;
      top: 20px;
    }
    .sidebar-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding-left: 4px;
    }
    .nav-step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 3px;
      border: 1.5px solid transparent;
    }
    .nav-step:hover { background: var(--cream-warm); border-color: var(--cream-border); }
    .nav-step.active {
      background: var(--green-dark);
      color: var(--cream);
      border-color: var(--green-dark);
    }
    .nav-step.done { border-color: var(--green-light); }
    .nav-dot {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid var(--cream-border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
      background: var(--white);
      color: var(--text-muted);
      transition: all 0.2s;
    }
    .nav-step.active .nav-dot {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--white);
    }
    .nav-step.done .nav-dot {
      background: var(--green-light);
      border-color: var(--green-light);
      color: var(--white);
    }
    .nav-label { font-size: 13px; font-weight: 400; }
    .nav-step.active .nav-label { font-weight: 700; color: var(--cream); }
    .nav-step.done .nav-label { color: var(--green-dark); font-weight: 600; }
    .nav-score-badge {
      margin-left: auto;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
      background: var(--cream-warm);
      color: var(--green-dark);
    }
    .nav-step.active .nav-score-badge { background: rgba(255,255,255,0.2); color: var(--cream); }

    /* ─── MAIN CONTENT ────────────────────────────────────────────── */
    .main-content { flex: 1; min-width: 0; }

    /* ─── CARDS ───────────────────────────────────────────────────── */
    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--cream-border);
      overflow: hidden;
      display: none;
    }
    .card.active { display: block; }

    .card-header {
      background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
      padding: 20px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .dept-icon {
      font-size: 28px;
      width: 50px; height: 50px;
      background: rgba(255,255,255,0.12);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .card-header-text h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      color: var(--cream);
      font-weight: 600;
    }
    .card-header-text p {
      color: var(--green-pale);
      font-size: 13px;
      margin-top: 3px;
    }
    .card-dept-avg {
      margin-left: auto;
      text-align: center;
      color: var(--cream);
    }
    .card-dept-avg .avg-num {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold-light);
      line-height: 1;
    }
    .card-dept-avg .avg-label { font-size: 11px; color: var(--green-pale); letter-spacing: 0.06em; }

    /* ─── CRITERIA ────────────────────────────────────────────────── */
    .criteria-grid {
      padding: 24px 28px;
      display: grid;
      gap: 14px;
    }

    .criterion-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      background: var(--cream);
      border-radius: var(--radius);
      border: 1.5px solid transparent;
      transition: border-color 0.2s;
    }
    .criterion-row.scored { border-color: var(--green-pale); background: #f6faf5; }

    .criterion-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 2px;
    }
    .criterion-desc {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 300;
    }

    .score-buttons {
      display: flex;
      gap: 5px;
    }
    .score-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 2px solid var(--cream-border);
      background: var(--white);
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
    }
    .score-btn:hover { border-color: var(--green-mid); color: var(--green-mid); transform: translateY(-1px); }
    .score-btn.selected-1 { background: var(--score-1); border-color: var(--score-1); color: #fff; }
    .score-btn.selected-2 { background: var(--score-2); border-color: var(--score-2); color: #fff; }
    .score-btn.selected-3 { background: var(--score-3); border-color: var(--score-3); color: #333; }
    .score-btn.selected-4 { background: var(--score-4); border-color: var(--score-4); color: #fff; }
    .score-btn.selected-5 { background: var(--score-5); border-color: var(--score-5); color: #fff; }

    /* ─── SCORE LEGEND ────────────────────────────────────────────── */
    .score-legend {
      display: flex;
      gap: 10px;
      padding: 0 28px 10px;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
    }

    /* ─── NOTES ───────────────────────────────────────────────────── */
    .notes-section {
      padding: 0 28px 24px;
    }
    .notes-section label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .notes-section textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--cream-border);
      border-radius: var(--radius);
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      color: var(--text-dark);
      background: var(--cream);
      resize: vertical;
      min-height: 80px;
      transition: border-color 0.2s;
    }
    .notes-section textarea:focus {
      outline: none;
      border-color: var(--green-light);
      background: var(--white);
    }

    /* ─── CARD FOOTER NAV ─────────────────────────────────────────── */
    .card-footer {
      padding: 16px 28px;
      background: var(--cream);
      border-top: 1px solid var(--cream-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .completion-info {
      font-size: 13px;
      color: var(--text-muted);
    }
    .completion-info strong { color: var(--green-dark); }
    .footer-btns { display: flex; gap: 10px; }

    /* ─── EVALUATOR CARD ──────────────────────────────────────────── */
    .evaluator-card .card-header {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    }
    .evaluator-fields {
      padding: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-group.full-width { grid-column: 1 / -1; }
    .field-group label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .field-group input, .field-group select {
      padding: 11px 14px;
      border: 1.5px solid var(--cream-border);
      border-radius: var(--radius);
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      color: var(--text-dark);
      background: var(--cream);
      transition: border-color 0.2s, background 0.2s;
    }
    .field-group input:focus, .field-group select:focus {
      outline: none;
      border-color: var(--green-light);
      background: var(--white);
    }

    /* ─── REVIEW CARD ─────────────────────────────────────────────── */
    .review-card .card-header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
    }
    .review-grid {
      padding: 24px 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .review-dept-card {
      padding: 14px 16px;
      background: var(--cream);
      border-radius: var(--radius);
      border: 1.5px solid var(--cream-border);
    }
    .review-dept-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--green-dark);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }
    .review-dept-score {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1;
    }
    .review-dept-bar {
      height: 4px;
      background: var(--cream-border);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .review-dept-bar-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
    .review-dept-criteria {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .overall-score-card {
      margin: 0 28px 24px;
      padding: 24px;
      background: linear-gradient(135deg, var(--green-dark), var(--green-mid));
      border-radius: var(--radius-lg);
      color: var(--cream);
      text-align: center;
    }
    .overall-score-card .big-score {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      font-weight: 700;
      color: var(--gold-light);
      line-height: 1;
    }
    .overall-score-card .score-label {
      color: var(--green-pale);
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .overall-score-card .score-stars {
      font-size: 22px;
      margin-top: 10px;
    }

    .api-config {
      padding: 0 28px 20px;
    }
    .api-config label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .api-config input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--cream-border);
      border-radius: var(--radius);
      font-family: 'Lato', monospace;
      font-size: 13px;
      color: var(--text-dark);
      background: var(--cream);
    }
    .api-config input:focus { outline: none; border-color: var(--green-light); background: var(--white); }

    /* ─── BUTTONS ─────────────────────────────────────────────────── */
    .btn {
      padding: 10px 20px;
      border-radius: var(--radius);
      font-family: 'Lato', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      letter-spacing: 0.03em;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .btn-primary {
      background: var(--green-dark);
      color: var(--cream);
    }
    .btn-primary:hover { background: var(--green-mid); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
    .btn-secondary {
      background: var(--cream-warm);
      color: var(--text-dark);
      border: 1.5px solid var(--cream-border);
    }
    .btn-secondary:hover { background: var(--cream-border); }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--white);
      padding: 13px 28px;
      font-size: 15px;
    }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-danger {
      background: #c0392b;
      color: #fff;
    }

    /* ─── TOAST / STATUS ──────────────────────────────────────────── */
    .toast-wrap {
      position: fixed;
      top: 20px; right: 20px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .toast {
      padding: 14px 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      font-size: 14px;
      font-weight: 600;
      color: var(--white);
      max-width: 320px;
      animation: slideIn 0.3s ease;
    }
    .toast.success { background: var(--green-dark); }
    .toast.error { background: #c0392b; }
    .toast.info { background: var(--gold); color: var(--text-dark); }
    @keyframes slideIn {
      from { transform: translateX(120%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(120%); opacity: 0; }
    }
    .toast.removing { animation: slideOut 0.3s ease forwards; }

    /* ─── SUBMIT SUCCESS ──────────────────────────────────────────── */
    .success-screen {
      display: none;
      text-align: center;
      padding: 60px 40px;
    }
    .success-screen.active { display: block; }
    .success-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .success-screen h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      color: var(--green-dark);
      margin-bottom: 10px;
    }
    .success-screen p { color: var(--text-muted); font-size: 15px; margin-bottom: 24px; }
    .success-ref {
      font-family: monospace;
      background: var(--cream-warm);
      padding: 8px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--green-dark);
      display: inline-block;
      margin-bottom: 28px;
    }

    /* ─── RESPONSIVE ──────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .app-layout { flex-direction: column; padding: 16px; gap: 16px; }
      .sidebar { width: 100%; }
      .sidebar-sticky { position: static; }
      .nav-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
      .evaluator-fields { grid-template-columns: 1fr; }
      .review-grid { grid-template-columns: 1fr; }
      .score-buttons .score-btn { width: 30px; height: 30px; font-size: 12px; }
      header h1 { font-size: 1.6rem; }
      .topbar { padding: 0 16px; font-size: 11px; }
    }

    .unsaved-dot {
      width: 7px; height: 7px;
      background: var(--gold);
      border-radius: 50%;
      display: none;
    }
    .nav-step.unsaved .unsaved-dot { display: block; }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <span class="topbar-tagline">Your Other Kitchen</span>
  <span id="topbarDate" class="topbar-date"></span>
</div>

<!-- HEADER -->
<header>
  <div class="header-leaf">🌿</div>
  <h1>Summerhill <span>Market</span></h1>
  <p class="subtitle">Store Evaluation &amp; Standards Review</p>
  <div class="header-divider"></div>
</header>

<!-- PROGRESS -->
<div class="progress-wrap">
  <div class="progress-label">
    <span id="progressText">Step 1 of 10</span>
    <span id="progressPct">0%</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
</div>

<!-- LAYOUT -->
<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-sticky">
      <div class="sidebar-title">Evaluation Steps</div>
      <div class="nav-steps" id="navSteps">
        <!-- injected by JS -->
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content" id="mainContent">
    <!-- injected by JS -->
  </main>
</div>

<!-- TOASTS -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
// ─── DATA MODEL ─────────────────────────────────────────────────────────────

const CRITERIA = [
  { id: 'cleanliness',    label: 'Cleanliness & Sanitation',       desc: 'Floors, surfaces, equipment, display cases' },
  { id: 'freshness',      label: 'Product Freshness & Quality',     desc: 'Date rotation, visual quality, condition' },
  { id: 'presentation',   label: 'Display Presentation',            desc: 'Merchandising, facing, visual appeal' },
  { id: 'stock',          label: 'Stock Availability',              desc: 'No gaps/voids, shelves adequately filled' },
  { id: 'variety',        label: 'Product Variety & Range',         desc: 'Breadth of selection, SKU coverage' },
  { id: 'signage',        label: 'Signage & Labeling',              desc: 'Price signs, product info, promotional tags' },
  { id: 'pricing',        label: 'Pricing Accuracy',                desc: 'Shelf price matches register, clear markings' },
  { id: 'temperature',    label: 'Temperature & Storage Compliance',desc: 'Cold chain integrity, proper storage conditions' },
  { id: 'safety',         label: 'Health & Safety Standards',       desc: 'Hazard-free aisles, food handling, compliance' },
  { id: 'staff_appear',   label: 'Staff Appearance',                desc: 'Uniform, grooming, professional presentation' },
  { id: 'staff_know',     label: 'Staff Product Knowledge',         desc: 'Ability to assist and advise customers' },
  { id: 'customer_svc',   label: 'Customer Service Quality',        desc: 'Responsiveness, friendliness, proactivity' },
  { id: 'organization',   label: 'Organization & Order',            desc: 'Logical layout, tidiness, backstock management' },
  { id: 'local_seasonal', label: 'Local & Seasonal Selection',      desc: 'Sourcing relationships, seasonal relevance' },
  { id: 'atmosphere',     label: 'Atmosphere & Sensory Experience', desc: 'Aroma, ambiance, overall department feel' },
  { id: 'waste',          label: 'Waste Management',                desc: 'Shrink control, markdown process, sustainability' },
  { id: 'innovation',     label: 'Innovation & Differentiation',    desc: 'Unique offerings, creative merchandising' },
  { id: 'brand_standard', label: 'Brand Standards Alignment',       desc: 'Adherence to Summerhill identity and values' },
];

const DEPARTMENTS = [
  { id: 'produce',        label: 'Produce',         icon: '🥦', desc: 'Fruits, vegetables, herbs & salad bar' },
  { id: 'meat',           label: 'Meat',             icon: '🥩', desc: 'Butcher counter, packaged meats & poultry' },
  { id: 'deli',           label: 'Deli',             icon: '🧀', desc: 'Charcuterie, cheese, prepared deli items' },
  { id: 'bakery',         label: 'Bakery',           icon: '🍞', desc: 'Breads, pastries, custom cakes & patisserie' },
  { id: 'prepared_foods', label: 'Prepared Foods',  icon: '🍱', desc: 'Hot bar, grab-and-go meals, catering items' },
  { id: 'floral',         label: 'Floral',           icon: '🌸', desc: 'Fresh flowers, plants & floral arrangements' },
  { id: 'grocery',        label: 'Grocery',          icon: '🛒', desc: 'Dry goods, pantry, specialty & international' },
  { id: 'general',        label: 'General',          icon: '🏪', desc: 'Store-wide standards, entrance & common areas' },
];

const SCORE_LABELS = { 1: 'Unacceptable', 2: 'Below Standard', 3: 'Meets Standard', 4: 'Above Standard', 5: 'Exceptional' };
const SCORE_COLORS = { 1: '#c0392b', 2: '#e67e22', 3: '#d4a500', 4: '#27ae60', 5: '#1e4620' };

// App state
const state = {
  step: 0, // 0 = evaluator info, 1-8 = departments, 9 = review & submit
  evaluator: { name: '', date: '', store: '', visitTime: '', role: '' },
  scores: {},  // { deptId: { criterionId: score } }
  notes: {},   // { deptId: string }
  apiEndpoint: '/api/evaluations',
  submitting: false,
  submitted: false,
};

DEPARTMENTS.forEach(d => { state.scores[d.id] = {}; state.notes[d.id] = ''; });

// ─── UTILITIES ───────────────────────────────────────────────────────────────

function deptAvg(deptId) {
  const scores = Object.values(state.scores[deptId]);
  if (!scores.length) return null;
  return (scores.reduce((a, b) => a + b, 0) / scores.length).toFixed(1);
}

function overallAvg() {
  const avgs = DEPARTMENTS.map(d => deptAvg(d.id)).filter(Boolean).map(Number);
  if (!avgs.length) return null;
  return (avgs.reduce((a, b) => a + b, 0) / avgs.length).toFixed(2);
}

function deptComplete(deptId) {
  return Object.keys(state.scores[deptId]).length === CRITERIA.length;
}

function scoredCount(deptId) {
  return Object.keys(state.scores[deptId]).length;
}

function totalSteps() { return 10; }

function progressPct() {
  const evalFilled = Object.values(state.evaluator).filter(Boolean).length;
  const evalScore = evalFilled >= 3 ? 1 : 0;
  const deptScores = DEPARTMENTS.map(d => scoredCount(d.id) / CRITERIA.length);
  const total = evalScore + deptScores.reduce((a, b) => a + b, 0);
  return Math.round((total / 9) * 100);
}

function scoreColor(avg) {
  const n = parseFloat(avg);
  if (n >= 4.5) return SCORE_COLORS[5];
  if (n >= 3.5) return SCORE_COLORS[4];
  if (n >= 2.5) return SCORE_COLORS[3];
  if (n >= 1.5) return SCORE_COLORS[2];
  return SCORE_COLORS[1];
}

function scoreStars(avg) {
  const n = parseFloat(avg);
  const full = Math.floor(n);
  const half = n - full >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  return '★'.repeat(full) + (half ? '☆' : '') + '✩'.repeat(empty);
}

function uniqueId() {
  return 'SHM-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).slice(2, 5).toUpperCase();
}

// ─── TOAST ──────────────────────────────────────────────────────────────────

function showToast(msg, type = 'success', duration = 3500) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('removing');
    setTimeout(() => el.remove(), 300);
  }, duration);
}

// ─── RENDER ──────────────────────────────────────────────────────────────────

function renderNav() {
  const container = document.getElementById('navSteps');
  const steps = [
    { label: 'Evaluator Info', icon: '📋' },
    ...DEPARTMENTS.map(d => ({ label: d.label, icon: d.icon, deptId: d.id })),
    { label: 'Review & Submit', icon: '✅' },
  ];

  container.innerHTML = steps.map((s, i) => {
    const isActive = state.step === i;
    const isDone = (() => {
      if (i === 0) return Object.values(state.evaluator).filter(Boolean).length >= 3;
      if (i <= 8) return deptComplete(DEPARTMENTS[i - 1].id);
      return false;
    })();
    const avg = s.deptId ? deptAvg(s.deptId) : null;
    return `
      <div class="nav-step ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}"
           onclick="goToStep(${i})" title="${s.label}">
        <div class="nav-dot">${isDone && !isActive ? '✓' : (i + 1)}</div>
        <div class="nav-label">${s.label}</div>
        ${avg ? `<span class="nav-score-badge">${avg}</span>` : ''}
        <div class="unsaved-dot"></div>
      </div>`;
  }).join('');
}

function renderEvaluatorCard() {
  const today = new Date().toISOString().split('T')[0];
  return `
    <div class="card evaluator-card ${state.step === 0 ? 'active' : ''}" id="card-0">
      <div class="card-header">
        <div class="dept-icon">📋</div>
        <div class="card-header-text">
          <h2>Evaluator Information</h2>
          <p>Complete your details before beginning the evaluation</p>
        </div>
      </div>
      <div class="evaluator-fields">
        <div class="field-group">
          <label>Evaluator Name *</label>
          <input type="text" id="eval-name" value="${state.evaluator.name}"
                 placeholder="e.g. Jane Smith" oninput="state.evaluator.name=this.value;syncProgress()">
        </div>
        <div class="field-group">
          <label>Role / Title</label>
          <input type="text" id="eval-role" value="${state.evaluator.role}"
                 placeholder="e.g. Store Manager" oninput="state.evaluator.role=this.value">
        </div>
        <div class="field-group">
          <label>Evaluation Date *</label>
          <input type="date" id="eval-date" value="${state.evaluator.date || today}"
                 oninput="state.evaluator.date=this.value;syncProgress()">
        </div>
        <div class="field-group">
          <label>Visit Time</label>
          <input type="time" id="eval-time" value="${state.evaluator.visitTime}"
                 oninput="state.evaluator.visitTime=this.value">
        </div>
        <div class="field-group full-width">
          <label>Store Location *</label>
          <select id="eval-store" onchange="state.evaluator.store=this.value;syncProgress()">
            <option value="">— Select Store —</option>
            <option value="Summerhill - Toronto (Yonge St)" ${state.evaluator.store === 'Summerhill - Toronto (Yonge St)' ? 'selected' : ''}>Summerhill Market — Toronto (Yonge St)</option>
            <option value="Summerhill - Oakville" ${state.evaluator.store === 'Summerhill - Oakville' ? 'selected' : ''}>Summerhill Market — Oakville</option>
            <option value="Summerhill - Other" ${state.evaluator.store === 'Summerhill - Other' ? 'selected' : ''}>Summerhill Market — Other Location</option>
          </select>
        </div>
      </div>
      <div class="card-footer">
        <span class="completion-info">Fields marked * are required</span>
        <div class="footer-btns">
          <button class="btn btn-primary" onclick="goToStep(1)">
            Begin Evaluation →
          </button>
        </div>
      </div>
    </div>`;
}

function renderDeptCard(dept, stepIndex) {
  const scored = scoredCount(dept.id);
  const avg = deptAvg(dept.id);
  const isActive = state.step === stepIndex;
  return `
    <div class="card ${isActive ? 'active' : ''}" id="card-${stepIndex}">
      <div class="card-header">
        <div class="dept-icon">${dept.icon}</div>
        <div class="card-header-text">
          <h2>${dept.label}</h2>
          <p>${dept.desc}</p>
        </div>
        <div class="card-dept-avg">
          <div class="avg-num" id="avg-${dept.id}">${avg || '—'}</div>
          <div class="avg-label">Avg Score</div>
        </div>
      </div>

      <div class="score-legend">
        ${Object.entries(SCORE_LABELS).map(([n, lbl]) =>
          `<div class="legend-item">
            <div class="legend-dot" style="background:${SCORE_COLORS[n]}"></div>
            <span>${n} — ${lbl}</span>
          </div>`).join('')}
      </div>

      <div class="criteria-grid">
        ${CRITERIA.map((c, ci) => {
          const sel = state.scores[dept.id][c.id];
          return `
            <div class="criterion-row ${sel ? 'scored' : ''}" id="row-${dept.id}-${c.id}">
              <div>
                <div class="criterion-label">${ci + 1}. ${c.label}</div>
                <div class="criterion-desc">${c.desc}</div>
              </div>
              <div class="score-buttons">
                ${[1,2,3,4,5].map(n => `
                  <button class="score-btn ${sel === n ? 'selected-'+n : ''}"
                          onclick="setScore('${dept.id}','${c.id}',${n})"
                          title="${SCORE_LABELS[n]}">${n}</button>`).join('')}
              </div>
            </div>`;
        }).join('')}
      </div>

      <div class="notes-section">
        <label>Department Notes &amp; Observations</label>
        <textarea id="notes-${dept.id}"
                  placeholder="Add any observations, highlights, or concerns for this department..."
                  oninput="state.notes['${dept.id}']=this.value">${state.notes[dept.id]}</textarea>
      </div>

      <div class="card-footer">
        <span class="completion-info">
          <strong>${scored}</strong> / ${CRITERIA.length} criteria scored
          ${avg ? `· Avg: <strong style="color:${scoreColor(avg)}">${avg}</strong>` : ''}
        </span>
        <div class="footer-btns">
          <button class="btn btn-secondary" onclick="goToStep(${stepIndex - 1})">← Back</button>
          <button class="btn btn-primary" onclick="goToStep(${stepIndex + 1})">
            ${stepIndex < 8 ? DEPARTMENTS[stepIndex].label + ' →' : 'Review & Submit →'}
          </button>
        </div>
      </div>
    </div>`;
}

function renderReviewCard() {
  const overall = overallAvg();
  const isActive = state.step === 9;
  return `
    <div class="card review-card ${isActive ? 'active' : ''}" id="card-9">
      <div class="card-header">
        <div class="dept-icon">📊</div>
        <div class="card-header-text">
          <h2>Review &amp; Submit</h2>
          <p>Confirm your evaluation before submitting to the database</p>
        </div>
      </div>

      <div class="overall-score-card">
        <div class="big-score" id="overall-big">${overall || '—'}</div>
        <div class="score-label">Overall Store Score / 5.00</div>
        <div class="score-stars" id="overall-stars">${overall ? scoreStars(overall) : ''}</div>
      </div>

      <div class="review-grid" id="reviewGrid">
        ${DEPARTMENTS.map(d => {
          const avg = deptAvg(d.id);
          const pct = avg ? ((parseFloat(avg) / 5) * 100).toFixed(0) : 0;
          const color = avg ? scoreColor(avg) : '#ccc';
          return `
            <div class="review-dept-card">
              <div class="review-dept-name">${d.icon} ${d.label}</div>
              <div class="review-dept-score" style="color:${color}">${avg || 'N/A'}</div>
              <div class="review-dept-bar">
                <div class="review-dept-bar-fill" style="width:${pct}%;background:${color}"></div>
              </div>
              <div class="review-dept-criteria">${scoredCount(d.id)}/${CRITERIA.length} criteria · ${avg ? SCORE_LABELS[Math.round(parseFloat(avg))] : 'Not scored'}</div>
            </div>`;
        }).join('')}
      </div>

      <div class="api-config">
        <label>API Endpoint (POST destination)</label>
        <input type="url" id="apiEndpointInput" value="${state.apiEndpoint}"
               oninput="state.apiEndpoint=this.value"
               placeholder="https://your-api.com/evaluations">
      </div>

      <div class="card-footer" style="justify-content:space-between;flex-wrap:wrap;gap:12px;">
        <div>
          <div style="font-size:13px;color:var(--text-muted);">
            Evaluator: <strong>${state.evaluator.name || '—'}</strong> ·
            Store: <strong>${state.evaluator.store || '—'}</strong> ·
            Date: <strong>${state.evaluator.date || '—'}</strong>
          </div>
        </div>
        <div class="footer-btns">
          <button class="btn btn-secondary" onclick="goToStep(8)">← Back</button>
          <button class="btn btn-gold" id="submitBtn" onclick="submitEvaluation()">
            Submit Evaluation ✓
          </button>
        </div>
      </div>

      <div class="success-screen" id="successScreen">
        <div class="success-icon">🌿</div>
        <h2>Evaluation Submitted!</h2>
        <p>Thank you. Your store evaluation has been recorded successfully.</p>
        <div class="success-ref" id="successRef"></div>
        <button class="btn btn-primary" onclick="startNew()">Start New Evaluation</button>
      </div>
    </div>`;
}

function renderAll() {
  const main = document.getElementById('mainContent');
  main.innerHTML =
    renderEvaluatorCard() +
    DEPARTMENTS.map((d, i) => renderDeptCard(d, i + 1)).join('') +
    renderReviewCard();
  renderNav();
  syncProgress();

  // Set today's date default
  if (!state.evaluator.date) {
    const dateEl = document.getElementById('eval-date');
    if (dateEl) {
      state.evaluator.date = dateEl.value;
    }
  }
}

// ─── STATE UPDATES ───────────────────────────────────────────────────────────

function setScore(deptId, criterionId, score) {
  state.scores[deptId][criterionId] = score;

  // Update the row styling
  const row = document.getElementById(`row-${deptId}-${criterionId}`);
  if (row) {
    row.classList.add('scored');
    row.querySelectorAll('.score-btn').forEach((btn, i) => {
      btn.className = 'score-btn';
      if (i + 1 === score) btn.classList.add('selected-' + score);
    });
  }

  // Update dept avg display
  const avg = deptAvg(deptId);
  const avgEl = document.getElementById(`avg-${deptId}`);
  if (avgEl) avgEl.textContent = avg || '—';

  // Update footer
  const stepIndex = DEPARTMENTS.findIndex(d => d.id === deptId) + 1;
  const card = document.getElementById(`card-${stepIndex}`);
  if (card) {
    const info = card.querySelector('.completion-info');
    if (info) {
      const sc = scoredCount(deptId);
      info.innerHTML = `<strong>${sc}</strong> / ${CRITERIA.length} criteria scored` +
        (avg ? ` · Avg: <strong style="color:${scoreColor(avg)}">${avg}</strong>` : '');
    }
  }

  syncProgress();
  renderNav();
}

function syncProgress() {
  const pct = progressPct();
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressText').textContent =
    `Step ${state.step + 1} of ${totalSteps()}`;
}

function goToStep(i) {
  if (i < 0 || i > 9) return;
  // Hide current
  const current = document.getElementById(`card-${state.step}`);
  if (current) current.classList.remove('active');
  state.step = i;
  const next = document.getElementById(`card-${i}`);
  if (next) next.classList.add('active');
  renderNav();
  syncProgress();
  // Update review if going to final step
  if (i === 9) refreshReview();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function refreshReview() {
  const overall = overallAvg();
  const bigEl = document.getElementById('overall-big');
  const starsEl = document.getElementById('overall-stars');
  if (bigEl) bigEl.textContent = overall || '—';
  if (starsEl) starsEl.textContent = overall ? scoreStars(overall) : '';

  const grid = document.getElementById('reviewGrid');
  if (grid) {
    grid.innerHTML = DEPARTMENTS.map(d => {
      const avg = deptAvg(d.id);
      const pct = avg ? ((parseFloat(avg) / 5) * 100).toFixed(0) : 0;
      const color = avg ? scoreColor(avg) : '#ccc';
      return `
        <div class="review-dept-card">
          <div class="review-dept-name">${d.icon} ${d.label}</div>
          <div class="review-dept-score" style="color:${color}">${avg || 'N/A'}</div>
          <div class="review-dept-bar">
            <div class="review-dept-bar-fill" style="width:${pct}%;background:${color}"></div>
          </div>
          <div class="review-dept-criteria">${scoredCount(d.id)}/${CRITERIA.length} criteria · ${avg ? SCORE_LABELS[Math.round(parseFloat(avg))] : 'Not scored'}</div>
        </div>`;
    }).join('');
  }

  // Update evaluator summary
  const footer = document.querySelector('.review-card .card-footer div');
  if (footer) {
    footer.innerHTML = `
      <div style="font-size:13px;color:var(--text-muted);">
        Evaluator: <strong>${state.evaluator.name || '—'}</strong> ·
        Store: <strong>${state.evaluator.store || '—'}</strong> ·
        Date: <strong>${state.evaluator.date || '—'}</strong>
      </div>`;
  }
}

// ─── SUBMIT ───────────────────────────────────────────────────────────────────

async function submitEvaluation() {
  if (state.submitting) return;

  if (!state.evaluator.name || !state.evaluator.store || !state.evaluator.date) {
    showToast('Please complete evaluator info (name, store, date) before submitting.', 'error', 4000);
    goToStep(0);
    return;
  }

  if (!state.apiEndpoint) {
    showToast('Please enter an API endpoint URL.', 'error', 4000);
    return;
  }

  state.submitting = true;
  const btn = document.getElementById('submitBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Submitting…'; }

  const refId = uniqueId();
  const payload = {
    referenceId: refId,
    submittedAt: new Date().toISOString(),
    evaluator: { ...state.evaluator },
    departments: {},
    overallScore: overallAvg() ? parseFloat(overallAvg()) : null,
    criteria: CRITERIA.map(c => c.id),
  };

  DEPARTMENTS.forEach(d => {
    payload.departments[d.id] = {
      name: d.label,
      scores: { ...state.scores[d.id] },
      average: deptAvg(d.id) ? parseFloat(deptAvg(d.id)) : null,
      notes: state.notes[d.id] || '',
      criteriaScored: scoredCount(d.id),
    };
  });

  try {
    const res = await fetch(state.apiEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!res.ok) {
      const errText = await res.text().catch(() => res.statusText);
      throw new Error(`Server responded ${res.status}: ${errText}`);
    }

    // Success
    showToast('Evaluation submitted successfully!', 'success', 4000);
    const btn = document.getElementById('submitBtn');
    if (btn) btn.style.display = 'none';
    const ss = document.getElementById('successScreen');
    if (ss) ss.classList.add('active');
    const refEl = document.getElementById('successRef');
    if (refEl) refEl.textContent = 'Reference: ' + refId;
    state.submitted = true;

  } catch (err) {
    console.error('Submission error:', err);
    showToast('Submission failed: ' + err.message, 'error', 6000);
    if (btn) { btn.disabled = false; btn.textContent = 'Submit Evaluation ✓'; }
  } finally {
    state.submitting = false;
  }
}

function startNew() {
  // Reset state
  state.step = 0;
  state.evaluator = { name: '', date: '', store: '', visitTime: '', role: '' };
  DEPARTMENTS.forEach(d => { state.scores[d.id] = {}; state.notes[d.id] = ''; });
  state.submitting = false;
  state.submitted = false;
  renderAll();
}

// ─── TOPBAR DATE ───────────────────────────────────────────────────────────

function setTopbarDate() {
  const el = document.getElementById('topbarDate');
  if (!el) return;
  const now = new Date();
  el.textContent = now.toLocaleDateString('en-CA', {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });
}

// ─── INIT ──────────────────────────────────────────────────────────────────

setTopbarDate();
renderAll();
</script>
