<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chore Grades">
  <title>Chore Report Card ⭐</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bridget: #8b5cf6;
      --bridget-bg: #ede9fe;
      --burke: #06b6d4;
      --burke-bg: #e0f9ff;
      --caleigh: #ec4899;
      --caleigh-bg: #fce7f3;
      --pass: #16a34a;
      --pass-bg: #dcfce7;
      --fail: #dc2626;
      --fail-bg: #fee2e2;
      --surface: #ffffff;
      --bg: #f3f4f6;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    }

    /* ── HEADER ── */
    .header {
      background: var(--surface);
      padding: 14px 20px 10px;
      padding-top: max(14px, env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header h1 {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .date-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 8px;
    }

    .date-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      line-height: 1;
      padding: 6px 12px;
      border-radius: 8px;
      color: var(--text);
      cursor: pointer;
      touch-action: manipulation;
    }
    .date-btn:active { background: var(--border); }
    .date-btn:disabled { color: var(--border); cursor: default; }
    .date-btn:disabled:active { background: none; }

    .date-display {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      min-width: 140px;
      text-align: center;
    }

    /* ── MAIN SCROLL AREA ── */
    .main {
      padding: 14px 14px 0;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── DAUGHTER CARDS ── */
    .daughter-card {
      background: var(--surface);
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      color: white;
    }
    .card-header.bridget { background: var(--bridget); }
    .card-header.burke   { background: var(--burke); }
    .card-header.caleigh { background: var(--caleigh); }

    .card-avatar { font-size: 1.9rem; line-height: 1; }

    .card-name {
      font-size: 1.25rem;
      font-weight: 700;
      flex: 1;
      letter-spacing: -0.2px;
    }

    .card-score {
      font-size: 0.9rem;
      font-weight: 700;
      background: rgba(255,255,255,0.28);
      padding: 5px 11px;
      border-radius: 20px;
    }

    /* ── TASKS ── */
    .tasks { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 8px; }

    .task-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
    }

    .task-label {
      flex: 1;
      font-size: 0.92rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #374151;
    }

    .task-emoji { font-size: 1.15rem; }

    .grade-btns { display: flex; gap: 8px; }

    .grade-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 2px solid var(--border);
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f9fafb;
      color: #d1d5db;
      touch-action: manipulation;
      transition: transform 0.1s, background 0.15s, border-color 0.15s, color 0.15s;
      font-weight: 700;
    }
    .grade-btn:active { transform: scale(0.88); }

    .grade-btn.pass-btn.active {
      background: var(--pass-bg);
      border-color: var(--pass);
      color: var(--pass);
    }
    .grade-btn.fail-btn.active {
      background: var(--fail-bg);
      border-color: var(--fail);
      color: var(--fail);
    }

    /* ── SUMMARY ── */
    .summary {
      background: var(--surface);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }

    .summary-title {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .summary-item {
      border-radius: 14px;
      padding: 12px 8px;
      text-align: center;
    }
    .summary-item.bridget { background: var(--bridget-bg); }
    .summary-item.burke   { background: var(--burke-bg); }
    .summary-item.caleigh { background: var(--caleigh-bg); }

    .summary-name {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 5px;
    }
    .summary-item.bridget .summary-name { color: var(--bridget); }
    .summary-item.burke   .summary-name { color: var(--burke); }
    .summary-item.caleigh .summary-name { color: var(--caleigh); }

    .summary-stars { font-size: 0.9rem; margin-bottom: 3px; }

    .summary-score { font-size: 1.4rem; font-weight: 800; }
    .summary-item.bridget .summary-score { color: var(--bridget); }
    .summary-item.burke   .summary-score { color: var(--burke); }
    .summary-item.caleigh .summary-score { color: var(--caleigh); }

    /* ── HISTORY BUTTON ── */
    .history-btn {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      width: 100%;
      text-align: center;
      touch-action: manipulation;
      margin-bottom: 14px;
    }
    .history-btn:active { background: var(--bg); }

    /* ── SAFE AREA FOOTER ── */
    .safe-footer { height: max(20px, env(safe-area-inset-bottom)); }

    /* ── HISTORY MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      display: flex;
      align-items: flex-end;
    }
    .modal-overlay.hidden { display: none; }

    .modal {
      background: white;
      border-radius: 22px 22px 0 0;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      max-height: 82vh;
      overflow-y: auto;
      padding: 20px 18px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h2 { font-size: 1.1rem; font-weight: 800; }

    .modal-close {
      background: var(--bg);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 0.85rem;
      cursor: pointer;
      color: var(--muted);
      font-weight: 700;
    }
    .modal-close:active { background: var(--border); }

    .history-day {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .history-date-label {
      background: var(--bg);
      padding: 9px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .history-scores {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 12px;
      gap: 6px;
    }

    .history-score-item { text-align: center; }

    .history-score-name {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 3px;
    }

    .history-score-val {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .history-score-stars { font-size: 0.75rem; margin-top: 1px; }

    .s3 { color: #16a34a; }
    .s2 { color: #ca8a04; }
    .s1 { color: #f97316; }
    .s0 { color: #dc2626; }
  </style>
</head>
<body>

  <div class="header">
    <h1>⭐ Chore Report Card</h1>
    <div class="date-nav">
      <button class="date-btn" id="prev-btn" onclick="changeDate(-1)">‹</button>
      <div class="date-display" id="date-display"></div>
      <button class="date-btn" id="next-btn" onclick="changeDate(1)">›</button>
    </div>
  </div>

  <div class="main" id="main"></div>

  <!-- History Modal -->
  <div class="modal-overlay hidden" id="history-modal">
    <div class="modal" id="modal-inner">
      <div class="modal-header">
        <h2>📅 History</h2>
        <button class="modal-close" onclick="hideHistory()">✕</button>
      </div>
      <div id="history-content"></div>
    </div>
  </div>

  <script>
    const DAUGHTERS = [
      { id: 'bridget', name: 'Bridget', emoji: '👧', cls: 'bridget' },
      { id: 'burke',   name: 'Burke',   emoji: '🌟', cls: 'burke'   },
      { id: 'caleigh', name: 'Caleigh', emoji: '🌸', cls: 'caleigh' },
    ];

    const TASKS = [
      { id: 'dishes', label: 'Dishes Away',        emoji: '🍽️' },
      { id: 'wake',   label: 'Got Up On Time',      emoji: '⏰' },
      { id: 'school', label: 'To School On Time',   emoji: '🏫' },
    ];

    let currentDate = todayStr();
    let grades = loadData();

    // ── Helpers ──────────────────────────────────────────

    function todayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDate(str) {
      const today = todayStr();
      const d = new Date();
      d.setDate(d.getDate() - 1);
      const yesterday = d.toISOString().slice(0, 10);
      if (str === today) return 'Today';
      if (str === yesterday) return 'Yesterday';
      const dt = new Date(str + 'T12:00:00');
      return dt.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
    }

    function formatDateShort(str) {
      const dt = new Date(str + 'T12:00:00');
      return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }

    function loadData() {
      try {
        const s = localStorage.getItem('choreGrades_v2');
        return s ? JSON.parse(s) : {};
      } catch { return {}; }
    }

    function saveData() {
      localStorage.setItem('choreGrades_v2', JSON.stringify(grades));
    }

    function getGrade(date, daughter, task) {
      return grades?.[date]?.[daughter]?.[task] ?? null;
    }

    function toggleGrade(date, daughter, task, value) {
      if (!grades[date]) grades[date] = {};
      if (!grades[date][daughter]) grades[date][daughter] = {};
      const cur = grades[date][daughter][task] ?? null;
      grades[date][daughter][task] = (cur === value) ? null : value;
      saveData();
      render();
    }

    function getScore(date, daughter) {
      let done = 0, graded = 0;
      for (const t of TASKS) {
        const g = getGrade(date, daughter, t.id);
        if (g !== null) { graded++; if (g === true) done++; }
      }
      return { done, graded };
    }

    function stars(done, graded) {
      if (graded === 0) return '☆☆☆';
      return TASKS.map((_, i) => i < done ? '⭐' : '☆').join('');
    }

    function scoreClass(done) {
      return ['s0','s1','s2','s3'][done] || 's0';
    }

    // ── Date nav ──────────────────────────────────────────

    function changeDate(delta) {
      const parts = currentDate.split('-').map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      d.setDate(d.getDate() + delta);
      const next = [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, '0'),
        String(d.getDate()).padStart(2, '0')
      ].join('-');
      if (next > todayStr()) return;
      currentDate = next;
      render();
    }

    // ── Render ────────────────────────────────────────────

    function render() {
      // Date header
      document.getElementById('date-display').textContent = formatDate(currentDate);
      document.getElementById('next-btn').disabled = (currentDate === todayStr());

      const main = document.getElementById('main');
      let html = '';

      // Daughter cards
      for (const d of DAUGHTERS) {
        const score = getScore(currentDate, d.id);
        const scoreLabel = score.graded === 0 ? '—/3' : `${score.done}/3`;

        let tasksHtml = '';
        for (const t of TASKS) {
          const g = getGrade(currentDate, d.id, t.id);
          tasksHtml += `
            <div class="task-row">
              <div class="task-label">
                <span class="task-emoji">${t.emoji}</span>
                ${t.label}
              </div>
              <div class="grade-btns">
                <button class="grade-btn pass-btn ${g === true ? 'active' : ''}"
                  onclick="toggleGrade('${currentDate}','${d.id}','${t.id}',true)">✓</button>
                <button class="grade-btn fail-btn ${g === false ? 'active' : ''}"
                  onclick="toggleGrade('${currentDate}','${d.id}','${t.id}',false)">✗</button>
              </div>
            </div>`;
        }

        html += `
          <div class="daughter-card">
            <div class="card-header ${d.cls}">
              <span class="card-avatar">${d.emoji}</span>
              <span class="card-name">${d.name}</span>
              <span class="card-score">${scoreLabel}</span>
            </div>
            <div class="tasks">${tasksHtml}</div>
          </div>`;
      }

      // Summary
      let summaryGrid = '';
      for (const d of DAUGHTERS) {
        const s = getScore(currentDate, d.id);
        summaryGrid += `
          <div class="summary-item ${d.cls}">
            <div class="summary-name">${d.name}</div>
            <div class="summary-stars">${stars(s.done, s.graded)}</div>
            <div class="summary-score">${s.graded === 0 ? '—' : s.done + '/3'}</div>
          </div>`;
      }

      html += `
        <div class="summary">
          <div class="summary-title">Today's Summary</div>
          <div class="summary-grid">${summaryGrid}</div>
        </div>
        <button class="history-btn" onclick="showHistory()">📅 View History</button>
        <div class="safe-footer"></div>`;

      main.innerHTML = html;
    }

    // ── History Modal ─────────────────────────────────────

    function showHistory() {
      const modal = document.getElementById('history-modal');
      modal.classList.remove('hidden');

      const content = document.getElementById('history-content');
      const allDates = Object.keys(grades).sort().reverse();

      if (allDates.length === 0) {
        content.innerHTML = '<p style="text-align:center;color:#9ca3af;padding:24px 0">No grades recorded yet!</p>';
        return;
      }

      let html = '';
      for (const date of allDates) {
        let scoresHtml = '';
        for (const d of DAUGHTERS) {
          const s = getScore(date, d.id);
          const sc = scoreClass(s.done);
          scoresHtml += `
            <div class="history-score-item">
              <div class="history-score-name" style="color:var(--${d.cls})">${d.name}</div>
              <div class="history-score-val ${sc}">${s.graded === 0 ? '—' : s.done + '/3'}</div>
              <div class="history-score-stars">${stars(s.done, s.graded)}</div>
            </div>`;
        }
        html += `
          <div class="history-day">
            <div class="history-date-label">${formatDateShort(date)}</div>
            <div class="history-scores">${scoresHtml}</div>
          </div>`;
      }
      content.innerHTML = html;
    }

    function hideHistory() {
      document.getElementById('history-modal').classList.add('hidden');
    }

    // Close modal when clicking backdrop
    document.getElementById('history-modal').addEventListener('click', function(e) {
      if (e.target === this) hideHistory();
    });

    // Init
    render();
  </script>
</body>
</html>
